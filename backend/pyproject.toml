[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "fastapi>=0.135.1",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyjwt>=2.8.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "supabase>=2.28.3",
    "uvicorn>=0.42.0",
    "slowapi>=0.1.9",
    "feedparser>=6.0.12",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools]
packages = ["core", "routes", "radar"]
